name: build-kernel

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache AOSP clang r383902b
        id: cache-clang
        uses: actions/cache@v4
        with:
          path: /opt/clang
          key: clang-r383902b-v1

      - name: Fetch AOSP clang r383902b
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          mkdir -p /opt/clang
          curl -sL -o /tmp/clang.tar.gz "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android11-release/clang-r383902b.tar.gz"
          tar -xzf /tmp/clang.tar.gz -C /opt/clang
          ls /opt/clang/bin/clang

      - name: Install cross toolchain deps
        run: |
          export DEBIAN_FRONTEND=noninteractive
          # azure.archive.ubuntu.com (via mirror+file selector) throttles the
          # aarch64 cross-toolchain .debs. Replace the mirror selector with
          # direct canonical HTTPS sources and relax acquire timeouts.
          sudo rm -f /etc/apt/apt-mirrors.txt /etc/apt/sources.list.d/ubuntu.sources
          sudo tee /etc/apt/sources.list.d/ubuntu.sources >/dev/null <<'EOF'
          Types: deb
          URIs: https://archive.ubuntu.com/ubuntu/
          Suites: noble noble-updates noble-backports
          Components: main universe restricted multiverse
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg

          Types: deb
          URIs: https://security.ubuntu.com/ubuntu/
          Suites: noble-security
          Components: main universe restricted multiverse
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF
          sudo tee /etc/apt/apt.conf.d/99retry >/dev/null <<'EOF'
          Acquire::Retries "5";
          Acquire::http::Timeout "120";
          Acquire::https::Timeout "120";
          EOF
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu libssl-dev flex bison bc ccache

      - name: Cache ccache (incremental build)
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ github.ref }}-
            ccache-

      - name: Build Image + dtbs
        run: |
          export PATH="/opt/clang/bin:$PATH"
          export CCACHE_DIR=$HOME/.ccache
          export CCACHE_COMPILERCHECK=content
          make ARCH=arm64 CC="ccache clang" CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- KBUILD_BUILD_VERSION=${{ github.run_number }} -j$(nproc) -k Image dtbs

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Image-TALIH-PD1
          path: |
            arch/arm64/boot/Image
            vmlinux
            System.map
